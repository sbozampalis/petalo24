<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petalo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
</head>
<body>
<style id="app-style">
  :root{
    --ground:#170B22;
    --ground-deep:#0F0718;
    --panel:#2A1440;
    --panel-line:rgba(231,196,104,0.22);
    --hair:rgba(243,236,221,0.14);
    --ink:#F3ECDD;
    --ink-soft:#C6B7DA;
    --gold:#CBA046;
    --gold-bright:#E7C468;
    --shadow:rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    color:var(--ink);
    background:
      radial-gradient(1px 1px at 12% 22%, rgba(243,236,221,0.28) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 82% 14%, rgba(243,236,221,0.22) 50%, transparent 52%),
      radial-gradient(1px 1px at 62% 68%, rgba(243,236,221,0.18) 50%, transparent 52%),
      radial-gradient(1px 1px at 34% 82%, rgba(243,236,221,0.16) 50%, transparent 52%),
      radial-gradient(1.5px 1.5px at 92% 55%, rgba(243,236,221,0.2) 50%, transparent 52%),
      radial-gradient(1px 1px at 46% 38%, rgba(243,236,221,0.14) 50%, transparent 52%),
      var(--ground);
    font-family:'Alegreya', Georgia, 'Times New Roman', serif;
    line-height:1.6;
    position:relative;
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  h1,h2,h3{
    font-family:'Oswald','Arial Narrow',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    text-wrap:balance;
    margin:0;
    color:var(--ink);
  }
  .wrap{max-width:1180px; margin:0 auto; padding-inline:clamp(1.25rem,4vw,3rem);}
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:0.72rem;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold-bright);
  }
  :focus-visible{outline:2px solid var(--gold-bright); outline-offset:3px;}

  .grain-overlay{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60; opacity:0.5; mix-blend-mode:overlay;}

  /* ---------- header ---------- */
  .site-header{
    position:sticky; top:0; z-index:20;
    background:rgba(15,7,24,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--hair);
  }
  .site-header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-block:0.75rem;
  }
  .brand{display:flex; align-items:center; gap:0.55rem; text-decoration:none;}
  .brand img{width:1.85rem; height:auto;}
  .brand span{
    font-family:'Poppins',sans-serif; font-weight:800;
    font-size:1.15rem; letter-spacing:0.06em; color:var(--gold-bright);
  }
  .header-right{display:flex; align-items:center; gap:1.2rem;}
  nav.main-nav{display:flex; align-items:center; gap:1.6rem;}
  nav.main-nav a{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:0.76rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--ink-soft);
    padding-bottom:2px;
    border-bottom:1px solid transparent;
  }
  nav.main-nav a:hover{color:var(--ink); border-color:var(--gold);}
  nav.main-nav a.ig{color:var(--gold-bright);}
  @media (max-width:640px){ nav.main-nav{display:none;} }

  .lang-toggle{display:flex; border:1px solid var(--panel-line); border-radius:2px; overflow:hidden;}
  .lang-toggle button{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:0.7rem; letter-spacing:0.08em;
    padding:0.4rem 0.6rem; background:transparent; color:var(--ink-soft); border:none; cursor:pointer;
  }
  .lang-toggle button[aria-pressed="true"]{background:var(--gold); color:var(--ground-deep);}
  .lang-toggle button:not([aria-pressed="true"]):hover{color:var(--ink);}

  /* ---------- hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 760px 520px at 78% -8%, rgba(203,160,70,0.20), transparent 60%),
      linear-gradient(100deg, rgba(15,7,24,0.95) 0%, rgba(15,7,24,0.86) 40%, rgba(15,7,24,0.62) 100%),
      url("/images/hero-bg.jpg") center 30%/cover no-repeat;
    padding-block: clamp(2.8rem, 6vw, 4.6rem) clamp(2.4rem, 5vw, 3.6rem);
  }
  .hero .wrap{
    display:grid;
    grid-template-columns: minmax(0,1fr) minmax(200px, 320px);
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items:center;
  }
  @media (max-width:820px){ .hero .wrap{grid-template-columns:1fr;} }
  .hero h1{
    font-size:clamp(2.4rem, 6.6vw, 4.4rem);
    line-height:1.02;
    margin-block:0.6rem 1.1rem;
    color:var(--ink);
  }
  .hero-tagline{
    font-style:italic; font-family:'Alegreya',serif; font-weight:500;
    font-size:0.98rem; color:var(--gold-bright); margin:0 0 0.9rem;
  }
  .hero-sub{
    font-size:clamp(1.02rem, 1.8vw, 1.18rem);
    max-width:38ch;
    color:var(--ink-soft);
    margin-bottom:1.7rem;
  }
  .cta{
    display:inline-flex; align-items:center; gap:0.6rem;
    font-family:'Oswald',sans-serif; font-weight:600;
    font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ground-deep);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    text-decoration:none;
    padding:0.85rem 1.5rem;
    border-radius:2px;
    box-shadow:0 10px 24px -10px rgba(203,160,70,0.55);
  }
  .cta:hover{filter:brightness(1.08);}
  .hero-art{display:flex; justify-content:center; align-items:center;}
  .hero-art img{width:100%; max-width:270px; height:auto; filter:drop-shadow(0 0 26px rgba(203,160,70,0.35));}
  @media (prefers-reduced-motion:no-preference){
    .hero-art img{animation:glow 7s ease-in-out infinite alternate;}
  }
  @keyframes glow{
    from{filter:drop-shadow(0 0 18px rgba(203,160,70,0.28));}
    to{filter:drop-shadow(0 0 34px rgba(203,160,70,0.55));}
  }

  /* ---------- section heads ---------- */
  section{padding-block:clamp(2.6rem, 5vw, 4.2rem);}
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
    margin-bottom:2rem;
    padding-bottom:0.9rem;
    border-bottom:1px solid var(--hair);
  }
  .section-head h2{font-size:clamp(1.7rem, 4vw, 2.4rem); margin-top:0.3rem;}
  .section-head .count{
    font-family:'Oswald', sans-serif; font-weight:500;
    font-size:0.78rem; letter-spacing:0.05em; color:var(--ink-soft); white-space:nowrap;
  }

  /* ---------- team drop grid ---------- */
  .team-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:clamp(1.1rem, 2.5vw, 1.6rem);
    margin-bottom:clamp(2.2rem, 4vw, 3.2rem);
  }
  .team-card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-line);
    display:flex; flex-direction:column;
  }
  .team-card::before, .team-card::after{content:""; position:absolute; width:16px; height:16px; pointer-events:none;}
  .team-card::before{top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold);}
  .team-card::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold);}
  .team-media{aspect-ratio:1/1; background:var(--ground-deep); overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .team-media img{width:100%; height:100%; object-fit:cover;}
  .team-media svg{width:60%; height:auto;}
  .team-body{padding:1.15rem 1.25rem 1.4rem; display:flex; flex-direction:column; gap:0.5rem; flex:1;}
  .pill{
    align-self:flex-start;
    font-family:'Oswald',sans-serif; font-weight:600;
    font-size:0.63rem; letter-spacing:0.12em; text-transform:uppercase;
    padding:0.28rem 0.6rem;
    border:1px solid var(--panel-line);
  }
  .pill.ready{color:var(--gold-bright);}
  .pill.design{color:var(--ink-soft); border-color:var(--hair);}
  .team-body .sub{
    font-family:'Oswald',sans-serif; font-weight:500; letter-spacing:0.05em;
    font-size:0.7rem; color:var(--ink-soft); text-transform:uppercase;
  }
  .team-body h3{font-size:1.28rem; line-height:1.1;}
  .team-body p.blurb{margin:0; font-size:0.88rem; color:var(--ink-soft);}
  .team-body p.note{
    font-size:0.74rem; font-style:italic; color:var(--ink-soft);
    margin:auto 0 0; padding-top:0.6rem; border-top:1px solid var(--hair);
  }

  /* ---------- secondary concept grid ---------- */
  .sub-head{margin-bottom:1.2rem;}
  .sub-head h3{font-size:1.15rem; color:var(--ink-soft); font-weight:500;}
  .concept-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:clamp(1rem, 2.5vw, 1.4rem);
  }
  .concept-card{
    background:rgba(42,20,64,0.5);
    border:1px dashed var(--panel-line);
    padding:1.3rem 1.2rem 1.5rem;
    display:flex; flex-direction:column; gap:0.65rem;
  }
  .concept-card .icon{width:50px; height:auto; opacity:0.9;}
  .concept-card h4{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
    font-size:1.05rem; margin:0; color:var(--ink);
  }
  .concept-card p{margin:0; font-size:0.88rem; color:var(--ink-soft);}

  /* ---------- about ---------- */
  .about .wrap{
    display:grid; grid-template-columns:1.15fr 0.85fr; gap:clamp(2rem,5vw,4rem);
    align-items:start;
  }
  @media (max-width:820px){ .about .wrap{grid-template-columns:1fr;} }
  .about p.lede{
    font-style:italic; font-size:clamp(1.15rem,2.4vw,1.4rem); line-height:1.4;
    color:var(--gold-bright); margin:0.4rem 0 1.1rem; max-width:30ch;
  }
  .about p.body-copy{font-size:1.05rem; color:var(--ink-soft); max-width:58ch; margin:0 0 1.3rem;}
  .pull{
    border-left:3px solid var(--gold);
    padding-left:1.1rem;
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:1.02rem;
    letter-spacing:0.02em;
    color:var(--ink);
    max-width:36ch;
  }
  .about-photo{
    position:relative;
    border:1px solid var(--panel-line);
    margin-bottom:1.5rem;
    overflow:hidden;
  }
  .about-photo::before, .about-photo::after{content:""; position:absolute; width:16px; height:16px; pointer-events:none;}
  .about-photo::before{top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold);}
  .about-photo::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold);}
  .about-photo img{width:100%; height:auto; display:block;}
  .about-photo figcaption{
    padding:0.6rem 0.9rem; font-family:'Oswald',sans-serif; font-size:0.68rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
    border-top:1px solid var(--hair);
  }
  .facts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.85rem;}
  .facts li{
    display:flex; justify-content:space-between; gap:1rem;
    padding-bottom:0.85rem;
    border-bottom:1px solid var(--hair);
    font-size:0.92rem;
  }
  .facts li span:first-child{color:var(--ink-soft);}
  .facts li span:last-child{font-weight:600; text-align:right; color:var(--ink);}

  .how{margin-top:clamp(2.2rem,4vw,3rem);}
  .how .eyebrow{display:block; margin-bottom:0.9rem;}
  .how-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:1.4rem;}
  .how-item{border-top:2px solid var(--gold); padding-top:0.8rem;}
  .how-item h4{
    font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:0.95rem;
    letter-spacing:0.04em; margin:0 0 0.4rem; color:var(--ink);
  }
  .how-item p{margin:0; font-size:0.88rem; color:var(--ink-soft);}

  /* ---------- contact ---------- */
  .contact{background:var(--panel); border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);}
  .contact .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1.5rem;}
  .contact-copy h2{font-size:clamp(1.5rem,3.2vw,2rem); margin-bottom:0.5rem;}
  .contact-copy p{margin:0 0 0.7rem; color:var(--ink-soft); max-width:44ch;}
  .contact-copy a.handle{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.06em;
    color:var(--gold-bright); text-decoration:none; font-size:0.95rem;
  }
  .contact-copy a.handle:hover{text-decoration:underline;}
  .stamp{
    font-family:'Oswald', sans-serif;
    border:2px solid var(--gold);
    color:var(--gold-bright);
    padding:0.7rem 1.3rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-size:0.8rem;
    white-space:nowrap;
    transform:rotate(-2deg);
  }

  footer{padding-block:1.8rem;}
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem;
    font-size:0.72rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft);
  }
  footer a{color:var(--gold-bright); text-decoration:none;}

  /* ---------- view routing ---------- */
  .view{display:none;}
  .view.is-active{display:block;}


  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  .team-card{text-decoration:none; color:inherit; cursor:pointer; transition:border-color .2s;}
  .team-card:hover{border-color:var(--gold);}

  /* ---------- shop page ---------- */
  .shop-page .shop-sub{color:var(--ink-soft); max-width:52ch; margin:-1rem 0 2rem;}
  .shop-all-link{
    display:inline-block; margin:0 0 clamp(2.2rem,4vw,3.2rem);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:0.78rem;
    letter-spacing:0.08em; text-transform:uppercase; text-decoration:none;
    color:var(--gold-bright); border-bottom:1px solid var(--gold); padding-bottom:2px;
  }
  .shop-all-link:hover{color:var(--ink);}
  .shop-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:clamp(1.1rem, 2.5vw, 1.6rem);}
  .shop-card{position:relative; background:var(--panel); border:1px solid var(--panel-line); display:flex; flex-direction:column;}
  .shop-card::before, .shop-card::after{content:""; position:absolute; width:16px; height:16px; pointer-events:none;}
  .shop-card::before{top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold);}
  .shop-card::after{bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold);}
  .shop-card-media{display:flex; aspect-ratio:1/1; background:var(--ground-deep); overflow:hidden; align-items:center; justify-content:center;}
  .shop-card-media img{width:100%; height:100%; object-fit:cover;}
  .shop-card-media svg{width:58%; height:auto;}
  .shop-card-body{padding:1.05rem 1.15rem 1.3rem; display:flex; flex-direction:column; gap:0.55rem; flex:1;}
  .shop-card-name{text-decoration:none; color:inherit;}
  .shop-card-name h3{font-size:1.05rem; line-height:1.15;}
  .shop-card-name:hover h3{color:var(--gold-bright);}
  .shop-card-price{font-family:'Oswald',sans-serif; font-weight:600; font-size:0.92rem; color:var(--gold-bright); letter-spacing:0.02em;}
  .shop-card-form{display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:auto; padding-top:0.5rem;}
  .shop-card-form select{
    flex:1; min-width:64px; background:var(--ground-deep); color:var(--ink);
    border:1px solid var(--panel-line); border-radius:2px;
    font-family:'Oswald',sans-serif; font-size:0.72rem; letter-spacing:0.04em; padding:0.45rem 0.4rem;
  }
  .shop-card-add{
    flex-basis:100%; font-family:'Oswald',sans-serif; font-weight:600; font-size:0.74rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--ground-deep);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none; border-radius:2px; cursor:pointer; padding:0.6rem 0.8rem;
  }
  .shop-card-add:hover{filter:brightness(1.08);}

  /* ---------- product detail ---------- */
  .back-link{
    display:inline-block; margin-bottom:1.6rem;
    font-family:'Oswald',sans-serif; font-weight:500; font-size:0.76rem;
    letter-spacing:0.08em; text-transform:uppercase; text-decoration:none; color:var(--ink-soft);
  }
  .back-link:hover{color:var(--gold-bright);}
  .product-layout{display:grid; grid-template-columns:1fr 1fr; gap:clamp(2rem,5vw,3.6rem); align-items:start; padding-bottom:clamp(2rem,4vw,3rem);}
  @media (max-width:820px){ .product-layout{grid-template-columns:1fr;} }
  .product-media{position:relative; background:var(--panel); border:1px solid var(--panel-line); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .product-media img{width:100%; height:100%; object-fit:cover;}
  .product-media svg{width:56%; height:auto;}
  .pmedia-carousel{position:relative; width:100%; height:100%;}
  .pmedia-track{display:flex; width:100%; height:100%; transition:transform .35s ease;}
  .pmedia-track .pmedia-slide{flex:0 0 100%; width:100%; height:100%; object-fit:cover; display:block;}
  .pmedia-nav{position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:none; background:rgba(15,7,24,.6); color:var(--ink,#F3ECDD); font-size:18px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2; padding:0;}
  .pmedia-nav:hover{background:rgba(15,7,24,.85);}
  .pmedia-nav.prev{left:8px;}
  .pmedia-nav.next{right:8px;}
  .pmedia-dots{position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:2;}
  .pmedia-dot{width:6px; height:6px; border-radius:50%; background:rgba(243,236,221,.45); cursor:pointer; border:none; padding:0;}
  .pmedia-dot.active{background:var(--gold-bright, var(--gold)); width:16px; border-radius:3px;}
  .product-info .sub{font-family:'Oswald',sans-serif; font-weight:500; letter-spacing:0.05em; font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase;}
  .product-info h1{font-size:clamp(1.6rem,3.4vw,2.2rem); margin:0.35rem 0 0.7rem;}
  .product-price{display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:1.3rem; color:var(--gold-bright); margin-bottom:0.9rem;}
  .product-blurb{color:var(--ink-soft); font-size:1rem; margin:0 0 0.5rem; max-width:48ch;}
  .product-info .note{font-size:0.78rem; font-style:italic; color:var(--ink-soft); margin:0 0 1.4rem;}
  .option-group{margin-bottom:1.2rem;}
  .option-label{display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:0.55rem;}
  .shipping-note{font-size:0.8rem; color:var(--ink-soft);}

  /* ---------- survey widget ---------- */
  .survey{display:flex; flex-direction:column; gap:0.55rem; margin-top:auto; padding-top:0.5rem;}
  .product-info .survey{margin-top:0; padding-top:0; margin-bottom:1.1rem;}
  .survey-btns{display:flex; flex-wrap:wrap; gap:0.5rem;}
  .survey-btn{
    flex:1 1 130px; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase;
    border-radius:2px; cursor:pointer; padding:0.6rem 0.7rem;
    border:1px solid var(--panel-line); background:transparent; color:var(--ink-soft);
  }
  .survey-btn.is-yes{
    color:var(--ground-deep); border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  }
  .survey-btn.is-yes:hover{filter:brightness(1.08);}
  .survey-btn.is-no:hover{color:var(--ink); border-color:var(--gold);}
  .survey-btns.survey-email input{
    flex:1 1 140px; font-family:'Alegreya',serif; font-size:0.9rem;
    background:var(--ground-deep); color:var(--ink);
    border:1px solid var(--panel-line); border-radius:2px; padding:0.55rem 0.65rem;
  }
  .survey-btns.survey-email input:focus-visible{outline:2px solid var(--gold-bright); outline-offset:1px;}
  .survey-submit{
    flex:1 1 130px; font-family:'Oswald',sans-serif; font-weight:600;
    font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ground-deep); background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none; border-radius:2px; cursor:pointer; padding:0.6rem 0.7rem;
  }

  function carouselMediaHTML(imgs, nameEN){
    var slides = imgs.map(function(src,i){
      return '<img class="pmedia-slide" src="'+src+'" alt="Petalo × '+nameEN+' — Insert Coin artwork '+(i+1)+'">';
    }).join('');
    var dots = imgs.map(function(_,i){
      return '<button type="button" class="pmedia-dot'+(i===0?' active':'')+'" data-i="'+i+'" aria-label="Slide '+(i+1)+'"></button>';
    }).join('');
    return '<div class="pmedia-carousel">' +
      '<div class="pmedia-track">'+slides+'</div>' +
      '<button type="button" class="pmedia-nav prev" aria-label="Previous image">‹</button>' +
      '<button type="button" class="pmedia-nav next" aria-label="Next image">›</button>' +
      '<div class="pmedia-dots">'+dots+'</div>' +
    '</div>';
  }
  function initCarousels(scope){
    (scope||document).querySelectorAll('.pmedia-carousel:not([data-cinit])').forEach(function(car){
      car.setAttribute('data-cinit','1');
      var track = car.querySelector('.pmedia-track');
      var slides = car.querySelectorAll('.pmedia-slide');
      var dots = car.querySelectorAll('.pmedia-dot');
      var idx = 0;
      function go(i){
        idx = (i + slides.length) % slides.length;
        track.style.transform = 'translateX(-' + (idx * 100) + '%)';
        dots.forEach(function(d,di){ d.classList.toggle('active', di === idx); });
      }
      var prevBtn = car.querySelector('.pmedia-nav.prev');
      var nextBtn = car.querySelector('.pmedia-nav.next');
      if(prevBtn) prevBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); go(idx - 1); });
      if(nextBtn) nextBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); go(idx + 1); });
      dots.forEach(function(d, di){
        d.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); go(di); });
      });
      var startX = null;
      track.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
      track.addEventListener('touchend', function(e){
        if(startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if(Math.abs(dx) > 30) go(idx + (dx < 0 ? 1 : -1));
        startX = null;
      });
    });
  }

  var SURVEY_VOTED_PREFIX = 'petalo-voted-';
  function votedValue(productId){
    try{ return localStorage.getItem(SURVEY_VOTED_PREFIX+productId); }catch(e){ return null; }

  function markVoted(productId, vote){
    try{ localStorage.setItem(SURVEY_VOTED_PREFIX+productId, vote); }catch(e){}
  }

  function recordSurveyResponse(productId, vote, email){
    markVoted(productId, vote);
    fetch('/api/vote', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({product: productId, vote: vote, email: email || ''})
    }).catch(function(){ /* vote is already remembered locally via markVoted */ });
  }

  function surveyWidgetHTML(productId){
    var voted = votedValue(productId);
    if(voted === 'yes') return '<div class="survey-thanks">'+STR[currentLang].survey_thanks_yes+'</div>';
    if(voted === 'no') return '<div class="survey-thanks">'+STR[currentLang].survey_thanks_no+'</div>';
    return (
      '<div class="survey" data-survey data-product-id="'+productId+'">' +
        '<span class="option-label">'+STR[currentLang].survey_question+'</span>' +
        '<div class="survey-btns" data-survey-btns>' +
          '<button type="button" class="survey-btn is-yes" data-survey-yes>'+STR[currentLang].survey_yes+'</button>' +
          '<button type="button" class="survey-btn is-no" data-survey-no>'+STR[currentLang].survey_no+'</button>' +
        '</div>' +
      '</div>'
    );
  }

  function wireSurveyWidgets(root){
    if(!root) return;
    root.querySelectorAll('[data-survey]').forEach(function(box){
      var pid = box.getAttribute('data-product-id');
      var btnsWrap = box.querySelector('[data-survey-btns]');
      var noBtn = box.querySelector('[data-survey-no]');
      var yesBtn = box.querySelector('[data-survey-yes]');
      if(noBtn){
        noBtn.addEventListener('click', function(){
          recordSurveyResponse(pid, 'no', '');
          var parent = box.parentNode;
          box.outerHTML = surveyWidgetHTML(pid);
          wireSurveyWidgets(parent);
        });
      }
      if(yesBtn){
        yesBtn.addEventListener('click', function(){
          btnsWrap.classList.add('survey-email');
          btnsWrap.innerHTML =
            '<input type="email" inputmode="email" placeholder="'+STR[currentLang].survey_email_placeholder+'" data-survey-email>' +
            '<button type="button" class="survey-submit" data-survey-submit>'+STR[currentLang].survey_email_cta+'</button>';
          var emailInput = btnsWrap.querySelector('[data-survey-email]');
          var submitBtn = btnsWrap.querySelector('[data-survey-submit]');
          function submit(){
            var email = (emailInput.value || '').trim();
            if(!email || email.indexOf('@') === -1){ emailInput.focus(); return; }
            recordSurveyResponse(pid, 'yes', email);
            var parent = box.parentNode;
            box.outerHTML = surveyWidgetHTML(pid);
            wireSurveyWidgets(parent);
          }
          submitBtn.addEventListener('click', submit);
          emailInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
          emailInput.focus();
        });
      }
    });
  }

  }

  function shopCardHTML(p){
    var name = currentLang === 'el' ? p.nameGR : p.nameEN;
    var media = productMediaHTML(p);
    return '<div class="shop-card">' +
      '<a class="shop-card-media" href="#/product/'+p.id+'">'+media+'</a>' +
      '<div class="shop-card-body">' +
        '<a class="shop-card-name" href="#/product/'+p.id+'"><h3>'+name+'</h3></a>' +
        '<span class="shop-card-price">'+fmtEUR(PRICE)+'</span>' +
        '<div class="shop-card-form">'+surveyWidgetHTML(p.id)+'</div>' +
      '</div>' +
    '</div>';
  }

  function renderShop(){
    var grid = document.getElementById('shopGrid');
    if(!grid) return;
    grid.innerHTML = products.map(shopCardHTML).join('');
    var countEl = document.getElementById('shopCount');
    if(countEl) countEl.textContent = STR[currentLang].shop_count(products.length);
    wireSurveyWidgets(grid);
    initCarousels(grid);
  }

  function renderProduct(id){
    var el = document.getElementById('productLayout');
    if(!el) return;
    var p = findProduct(id);
    if(!p){
      el.innerHTML = '<p class="empty-state">'+STR[currentLang].product_not_found+'</p>';
      return;
    }
    var name = currentLang === 'el' ? p.nameGR : p.nameEN;
    var blurb = currentLang === 'el' ? p.blurbGR : p.blurbEN;
    var media = productMediaHTML(p);

    el.innerHTML =
      '<div class="product-media">'+media+'</div>' +
      '<div class="product-info">' +
        '<span class="sub">PETALO \u00d7 '+name+'</span>' +
        '<h1>'+name+'</h1>' +
        '<span class="product-price">'+fmtEUR(PRICE)+'</span>' +
        '<p class="product-blurb">'+blurb+'</p>' +
        '<p class="note">'+STR[currentLang].note_fanconcept+'</p>' +
        surveyWidgetHTML(p.id) +
        '<p class="shipping-note">'+STR[currentLang].survey_note+'</p>' +
      '</div>';

    wireSurveyWidgets(el);
    initCarousels(el);
  }

  function currentRoute(){
    var h = window.location.hash || '';
    if(h.indexOf('#/') === 0) return h.slice(2);
    return null;
  }

  function showView(name){
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('is-active'); });
    var el = document.getElementById('view-'+name);
    if(el) el.classList.add('is-active');
  }

  function renderCurrentView(){
    var route = currentRoute();
    if(!route) return;
    var parts = route.split('/');
    if(parts[0] === 'shop') renderShop();
    else if(parts[0] === 'product' && parts[1]) renderProduct(parts[1]);
  }

  function handleRoute(){
    var route = currentRoute();
    var view = 'home';
    if(route){
      var parts = route.split('/');
      if(parts[0] === 'shop') view = 'shop';
      else if(parts[0] === 'product') view = 'product';
    }
    showView(view);
    renderCurrentView();
    if(route) window.scrollTo(0,0);
  }

  function render(){
    var grid = document.getElementById('teamGrid');
    if(grid) grid.innerHTML = teams.map(teamCardHTML).join('');

    var readyCount = teams.filter(function(t){return t.ready;}).length;
    var designCount = teams.length - readyCount;
    var countEl = document.getElementById('dropCount');
    if(countEl) countEl.textContent = STR[currentLang].count(readyCount, designCount);

    var d3grid = document.getElementById('drop3Grid');
    if(d3grid) d3grid.innerHTML = matchdayTeams.map(teamCardHTML).join('');

    var mdReadyCount = matchdayTeams.filter(function(t){return t.ready;}).length;
    var mdDesignCount = matchdayTeams.length - mdReadyCount;
    var mdCountEl = document.getElementById('dropCount3');
    if(mdCountEl) mdCountEl.textContent = STR[currentLang].count(mdReadyCount, mdDesignCount);
    var bgrid = document.getElementById('bballGrid');
    if(bgrid) bgrid.innerHTML = basketballTeams.map(teamCardHTML).join('');

    var bballReadyCount = basketballTeams.filter(function(t){return t.ready;}).length;
    var bballDesignCount = basketballTeams.length - bballReadyCount;
    var bballCountEl = document.getElementById('dropCount2');
    if(bballCountEl) bballCountEl.textContent = STR[currentLang].count(bballReadyCount, bballDesignCount);

    initCarousels(document);

    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      var val = STR[currentLang][key];
      if(val == null) return;
      if(el.hasAttribute('data-i18n-html')) el.innerHTML = val;
      else el.textContent = val;
    });

    document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang-btn') === currentLang ? 'true' : 'false');
    });

    try{ document.documentElement.lang = currentLang; }catch(e){}
  }

  function setLang(lang){
    currentLang = lang;
    try{ localStorage.setItem('petalo-lang', lang); }catch(e){}
    render();
    renderCurrentView();
  }

  document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-lang-btn')); });
  });

  render();
  handleRoute();
  window.addEventListener('hashchange', handleRoute);
})();
</script>

</body></html>
